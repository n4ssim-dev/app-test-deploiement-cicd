services:
  api:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME manquant dans .env}/test-ci-cd:api-latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: 3000

  front:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME manquant dans .env}/test-ci-cd:front-latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-80}:80"
    depends_on:
      - api
