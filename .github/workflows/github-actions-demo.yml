name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      # Injecté au build par @ngx-env ; sans lui, le bundle plante au chargement.
      NG_APP_API_URL: http://localhost:3000/api
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    # Uniquement après des tests verts, et seulement sur un push vers main
    # (jamais sur une PR : les secrets n'y sont pas exposés aux forks).
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: backend
          - service: front
            context: frontend
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.prod
          push: true
          # Ignoré par le backend ; figé dans le bundle Angular pour le front.
          build-args: |
            NG_APP_API_URL=${{ vars.NG_APP_API_URL || 'http://localhost:3000/api' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/test-ci-cd:${{ matrix.service }}-latest
            ${{ vars.DOCKERHUB_USERNAME }}/test-ci-cd:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
