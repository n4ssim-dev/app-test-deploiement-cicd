name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      # Injecté au build par @ngx-env ; sans lui, le bundle plante au chargement.
      NG_APP_API_URL: /api   #http://localhost:3000
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build
      - run: echo "::notice::Front construit avec NG_APP_API_URL=$NG_APP_API_URL"
