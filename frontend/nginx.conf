server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Appels API relayés vers le conteneur "api" (même origine : pas besoin de CORS)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Le navigateur envoie Origin même en same-origin (POST) : on le retire
        # pour que le backend ne rejette pas l'IP/domaine de la VM.
        proxy_set_header Origin "";
    }

    # Application Angular : toute URL inconnue renvoie index.html,
    # et c'est le router Angular qui gère ensuite la page à afficher
    location / {
        try_files $uri $uri/ /index.html;
    }
}
